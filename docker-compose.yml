services:
  # 1. Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edusphere_sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "EduSphere@2026StrongPass!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - edusphere_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EduSphere@2026StrongPass!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: edusphere_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - edusphere_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: edusphere_qdrant
    restart: always
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - edusphere_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edusphere_sql_data:
  edusphere_redis_data:
  edusphere_qdrant_data:
