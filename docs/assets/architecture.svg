<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 890" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2e"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="activeCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="layerGradPres" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="layerGradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="layerGradDomain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="layerGradInfra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06B6D4"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7"/>
    </marker>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#DC2626" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g id="header" transform="translate(50, 30)">
    <rect x="0" y="0" width="10" height="32" rx="4" fill="url(#headerGrad)"/>
    <text x="24" y="24" fill="#F8FAFC" font-size="22" font-weight="800" letter-spacing="-0.5">EduSphere — System Architecture</text>
    <text x="440" y="24" fill="#94A3B8" font-size="13" font-weight="500">.NET 8 Clean Architecture &amp; CQRS • React 19 SPA • AWS S3 Media CDN • Multi-Agent AI</text>
    <rect x="910" y="5" width="90" height="24" rx="12" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-width="1"/>
    <text x="955" y="21" fill="#FCA5A5" font-size="11" font-weight="700" text-anchor="middle">v1.3 LIVE</text>
  </g>

  <!-- ==================== 1. PRESENTATION LAYER ==================== -->
  <g id="layer-presentation" transform="translate(50, 80)">
    <rect x="0" y="0" width="1000" height="125" rx="12" fill="url(#layerGradPres)" stroke="#312e81" stroke-width="1.5"/>
    <rect x="16" y="-11" width="220" height="22" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="26" y="4" fill="#C7D2FE" font-size="11" font-weight="700" letter-spacing="0.5">1. PRESENTATION LAYER</text>

    <!-- Frontend SPA Card -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="440" height="82" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#0284C7" fill-opacity="0.2"/>
      <text x="24" y="28" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">UI</text>
      <text x="44" y="26" fill="#F9FAFB" font-size="14" font-weight="700">React 19 + Vite 8 SPA Client</text>
      <text x="44" y="46" fill="#9CA3AF" font-size="11">Tailwind CSS v4 • TanStack Query v5 • Framer Motion • Lucide</text>
      <text x="44" y="64" fill="#60A5FA" font-size="11" font-weight="500">CD-IELTS Split Workspace • Audio Waveform • Bento Studios</text>
    </g>

    <!-- Arrow between Frontend and Backend API -->
    <path d="M 465 65 L 525 65" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
    <text x="495" y="55" fill="#38BDF8" font-size="9.5" font-weight="600" text-anchor="middle">HTTPS / REST</text>
    <text x="495" y="80" fill="#64748B" font-size="9" text-anchor="middle">JSON / JWT</text>

    <!-- Web API Card -->
    <g transform="translate(535, 24)">
      <rect x="0" y="0" width="445" height="82" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#7C3AED" fill-opacity="0.2"/>
      <text x="24" y="28" fill="#A78BFA" font-size="12" font-weight="700" text-anchor="middle">API</text>
      <text x="44" y="26" fill="#F9FAFB" font-size="14" font-weight="700">ASP.NET Core 8 Web API Host</text>
      <text x="44" y="46" fill="#9CA3AF" font-size="11">AuthController • ReadingController • ListeningController • MediaController</text>
      <text x="44" y="64" fill="#C084FC" font-size="11" font-weight="500">Kestrel • ProblemDetails • Serilog • EnvLoader (.env) • Rate Limiting</text>
    </g>
  </g>

  <!-- Flow Arrow: Presentation -> Application -->
  <path d="M 550 205 L 550 238" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="490" y="212" width="120" height="18" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="550" y="225" fill="#F87171" font-size="10" font-weight="600" text-anchor="middle">MediatR Dispatches</text>

  <!-- ==================== 2. APPLICATION CORE LAYER ==================== -->
  <g id="layer-application" transform="translate(50, 240)">
    <rect x="0" y="0" width="1000" height="140" rx="12" fill="url(#layerGradApp)" stroke="#075985" stroke-width="1.5"/>
    <rect x="16" y="-11" width="240" height="22" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="26" y="4" fill="#BAE6FD" font-size="11" font-weight="700" letter-spacing="0.5">2. APPLICATION CORE (CQRS)</text>

    <!-- CQRS Card -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="300" height="96" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">MediatR CQRS Engine</text>
      <text x="16" y="44" fill="#9CA3AF" font-size="11">• Commands: Auth, SubmitExam, Ingest</text>
      <text x="16" y="62" fill="#9CA3AF" font-size="11">• Queries: GetPassages, GetTests, History</text>
      <text x="16" y="80" fill="#38BDF8" font-size="11" font-weight="500">Decoupled state mutation &amp; read models</text>
    </g>

    <!-- Pipeline Behaviors Card -->
    <g transform="translate(335, 24)">
      <rect x="0" y="0" width="310" height="96" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Cross-Cutting Pipeline Behaviors</text>
      <text x="16" y="44" fill="#9CA3AF" font-size="11">• ValidationBehavior (FluentValidation)</text>
      <text x="16" y="62" fill="#9CA3AF" font-size="11">• LoggingBehavior (Serilog structural ctx)</text>
      <text x="16" y="80" fill="#FBBF24" font-size="11" font-weight="500">Automated pre-execution quality gates</text>
    </g>

    <!-- Core Interfaces Card -->
    <g transform="translate(660, 24)">
      <rect x="0" y="0" width="320" height="96" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Inversion of Control Ports (Interfaces)</text>
      <text x="16" y="44" fill="#9CA3AF" font-size="11">• IApplicationDbContext, IEmailSender</text>
      <text x="16" y="62" fill="#9CA3AF" font-size="11">• IMediaStorageService, IListeningAITutor</text>
      <text x="16" y="80" fill="#34D399" font-size="11" font-weight="500">Zero dependency on concrete tech/cloud</text>
    </g>
  </g>

  <!-- Flow Arrow: Application -> Domain -->
  <path d="M 550 380 L 550 412" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="490" y="388" width="120" height="18" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="550" y="401" fill="#C084FC" font-size="10" font-weight="600" text-anchor="middle">Inward Dependency</text>

  <!-- ==================== 3. DOMAIN CORE LAYER ==================== -->
  <g id="layer-domain" transform="translate(50, 415)">
    <rect x="0" y="0" width="1000" height="135" rx="12" fill="url(#layerGradDomain)" stroke="#86198f" stroke-width="1.5"/>
    <rect x="16" y="-11" width="310" height="22" rx="6" fill="#701a75" stroke="#a21caf" stroke-width="1"/>
    <text x="26" y="4" fill="#F5D0FE" font-size="11" font-weight="700" letter-spacing="0.5">3. DOMAIN CORE (BUSINESS LOGIC &amp; RULES)</text>

    <!-- Entities Card -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="340" height="92" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Enterprise Domain Entities</text>
      <text x="16" y="44" fill="#9CA3AF" font-size="11">• User, RefreshToken, ReadingPassage, Question</text>
      <text x="16" y="62" fill="#9CA3AF" font-size="11">• ListeningTest, ListeningSection, Audio, Transcript</text>
      <text x="16" y="80" fill="#E879F9" font-size="11" font-weight="500">Aggregate Roots &amp; Entity Lifecycle Management</text>
    </g>

    <!-- Value Objects & Enums -->
    <g transform="translate(375, 24)">
      <rect x="0" y="0" width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Value Objects &amp; Domain Enums</text>
      <text x="16" y="44" fill="#9CA3AF" font-size="11">• BandScore (0.0 – 9.0 calculation)</text>
      <text x="16" y="62" fill="#9CA3AF" font-size="11">• QuestionType, SkillType, ExamStatus</text>
      <text x="16" y="80" fill="#F472B6" font-size="11" font-weight="500">Immutable value semantics &amp; validation</text>
    </g>

    <!-- Scoring Engine Card -->
    <g transform="translate(670, 24)">
      <rect x="0" y="0" width="310" height="92" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">IELTS Deterministic Scoring Logic</text>
      <text x="16" y="44" fill="#9CA3AF" font-size="11">• Official Cambridge Raw-to-Band Tables</text>
      <text x="16" y="62" fill="#9CA3AF" font-size="11">• Reading &amp; Listening 40-question rules</text>
      <text x="16" y="80" fill="#4ADE80" font-size="11" font-weight="500">Pure, zero external framework dependencies</text>
    </g>
  </g>

  <!-- Flow Arrows: Infrastructure implements Application Ports and persists Domain -->
  <path d="M 280 600 L 280 555" stroke="#10B981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowEmerald)"/>
  <rect x="200" y="568" width="160" height="18" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="280" y="581" fill="#6EE7B7" font-size="9.5" font-weight="600" text-anchor="middle">Persists / Queries Entities</text>

  <path d="M 820 600 L 820 385" stroke="#10B981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowEmerald)"/>
  <rect x="730" y="520" width="180" height="18" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="820" y="533" fill="#6EE7B7" font-size="9.5" font-weight="600" text-anchor="middle">Implements Application Ports</text>

  <!-- ==================== 4. INFRASTRUCTURE & EXTERNAL ADAPTERS ==================== -->
  <g id="layer-infrastructure" transform="translate(50, 600)">
    <rect x="0" y="0" width="1000" height="255" rx="12" fill="url(#layerGradInfra)" stroke="#065f46" stroke-width="1.5"/>
    <rect x="16" y="-11" width="340" height="22" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="26" y="4" fill="#A7F3D0" font-size="11" font-weight="700" letter-spacing="0.5">4. INFRASTRUCTURE &amp; CLOUD EXTERNAL ADAPTERS</text>

    <!-- Group 1: Persistence & Caching -->
    <g transform="translate(20, 24)">
      <!-- SQL Server -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="230" height="85" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">SQL Server 2022</text>
        <text x="16" y="44" fill="#9CA3AF" font-size="11">EF Core 8 • Fluent Mappings</text>
        <text x="16" y="60" fill="#9CA3AF" font-size="11">Code-First Migrations • Seeders</text>
        <text x="16" y="76" fill="#34D399" font-size="10.5" font-weight="600">Relational Database</text>
      </g>

      <!-- Redis -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="230" height="85" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Redis 7.x Distributed</text>
        <text x="16" y="44" fill="#9CA3AF" font-size="11">StackExchange.Redis Cache</text>
        <text x="16" y="60" fill="#9CA3AF" font-size="11">Passage Cache-Aside &amp; OTP TTL</text>
        <text x="16" y="76" fill="#F87171" font-size="10.5" font-weight="600">Sub-50ms Response Cache</text>
      </g>

      <!-- AWS S3 -->
      <g transform="translate(490, 0)">
        <rect x="0" y="0" width="230" height="85" rx="8" fill="url(#activeCardGrad)" stroke="#DC2626" stroke-width="1.5" filter="url(#glow)"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">AWS S3 Cloud Storage</text>
        <text x="16" y="44" fill="#FCA5A5" font-size="11">AWSSDK.S3 • Presigned URLs</text>
        <text x="16" y="60" fill="#9CA3AF" font-size="11">Bucket: edusphere-nvmtamm-2026</text>
        <text x="16" y="76" fill="#F87171" font-size="10.5" font-weight="700">IELTS Audio &amp; Media CDN</text>
      </g>

      <!-- Qdrant Vector DB -->
      <g transform="translate(735, 0)">
        <rect x="0" y="0" width="225" height="85" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Qdrant Vector DB</text>
        <text x="16" y="44" fill="#9CA3AF" font-size="11">RAG Rubric Embeddings</text>
        <text x="16" y="60" fill="#9CA3AF" font-size="11">Cosine Similarity Distance</text>
        <text x="16" y="76" fill="#A78BFA" font-size="10.5" font-weight="600">Vector Search Engine</text>
      </g>
    </g>

    <!-- Group 2: AI Pipelines, Identity & Communication -->
    <g transform="translate(20, 125)">
      <!-- Gemini Multi-Agent & Explainer -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="475" height="105" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Google Gemini 3.6 Flash Multi-Agent AI Subsystem</text>
        <text x="16" y="44" fill="#9CA3AF" font-size="11">• Ingestion Pipeline: Document Cleaner → Passage Extractor → 40Q Parser → Verifier</text>
        <text x="16" y="62" fill="#9CA3AF" font-size="11">• AI Post-Exam Diagnostic Explainer: Accent/Phonetics Nuances &amp; Distractor Traps</text>
        <text x="16" y="80" fill="#9CA3AF" font-size="11">• Exam AI Tutor: Socratic context-aware reading &amp; listening guidance</text>
        <text x="16" y="96" fill="#60A5FA" font-size="10.5" font-weight="600">7 Dedicated API Keys per Agent Subsystem • Strict Deterministic JSON Gate</text>
      </g>

      <!-- Google Identity Services -->
      <g transform="translate(490, 0)">
        <rect x="0" y="0" width="230" height="105" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">Google Identity</text>
        <text x="16" y="44" fill="#9CA3AF" font-size="11">OAuth 2.0 Token Verification</text>
        <text x="16" y="62" fill="#9CA3AF" font-size="11">Google.Apis.Auth Library</text>
        <text x="16" y="80" fill="#9CA3AF" font-size="11">Automatic account provisioning</text>
        <text x="16" y="96" fill="#FBBF24" font-size="10.5" font-weight="600">SSO Authentication</text>
      </g>

      <!-- MailKit SMTP -->
      <g transform="translate(735, 0)">
        <rect x="0" y="0" width="225" height="105" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
        <text x="16" y="24" fill="#F9FAFB" font-size="13" font-weight="700">MailKit / Gmail SMTP</text>
        <text x="16" y="44" fill="#9CA3AF" font-size="11">MimeKit HTML Templating</text>
        <text x="16" y="62" fill="#9CA3AF" font-size="11">Distributed 6-digit OTP codes</text>
        <text x="16" y="80" fill="#9CA3AF" font-size="11">TLS 1.3 encrypted handshake</text>
        <text x="16" y="96" fill="#34D399" font-size="10.5" font-weight="600">Secure Email Delivery</text>
      </g>
    </g>
  </g>
</svg>
