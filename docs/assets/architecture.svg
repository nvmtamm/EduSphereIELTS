<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1050" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2C3E50"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 9 1 L 0 5 L 9 9 z" fill="#2C3E50"/>
    </marker>
  </defs>

  <!-- ==================== 1. TEACHER / EXAMINER PERSONA (TOP-LEFT) ==================== -->
  <g id="teacher-avatar" transform="translate(20, 20)">
    <!-- Back Hair -->
    <path d="M 38 25 Q 16 45 18 92 Q 30 108 42 108 Q 50 65 50 35 Z" fill="#F5A623" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 68 25 Q 90 45 88 92 Q 76 108 64 108 Q 56 65 56 35 Z" fill="#F5A623" stroke="#2C3E50" stroke-width="2"/>
    <!-- Head -->
    <circle cx="53" cy="46" r="23" fill="#FCE8C5" stroke="#2C3E50" stroke-width="2"/>
    <!-- Front Hair -->
    <path d="M 32 38 Q 53 16 75 36 Q 60 48 32 38 Z" fill="#F5A623" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 34 39 Q 44 52 42 60" fill="none" stroke="#2C3E50" stroke-width="1.8"/>
    <path d="M 72 39 Q 62 52 64 60" fill="none" stroke="#2C3E50" stroke-width="1.8"/>
    <!-- Glasses -->
    <ellipse cx="43" cy="45" rx="6.5" ry="5.5" fill="none" stroke="#2C3E50" stroke-width="1.8"/>
    <ellipse cx="63" cy="45" rx="6.5" ry="5.5" fill="none" stroke="#2C3E50" stroke-width="1.8"/>
    <line x1="49.5" y1="45" x2="56.5" y2="45" stroke="#2C3E50" stroke-width="1.8"/>
    <!-- Body / Teal Jacket -->
    <path d="M 30 90 L 38 68 Q 53 65 68 68 L 76 90 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <!-- White Inner Collar -->
    <polygon points="48,67 58,67 53,79" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
    <!-- Open Cambridge Test Document -->
    <rect x="38" y="82" width="15" height="26" rx="2" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <rect x="53" y="82" width="15" height="26" rx="2" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <line x1="53" y1="82" x2="53" y2="108" stroke="#2C3E50" stroke-width="2"/>
    <!-- Hands holding book -->
    <circle cx="28" cy="96" r="8.5" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <circle cx="78" cy="96" r="8.5" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <!-- Stylus / Pointer -->
    <line x1="86" y1="96" x2="114" y2="38" stroke="#48CAE4" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="86" y1="96" x2="114" y2="38" stroke="#2C3E50" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Text Labels -->
    <text x="53" y="132" fill="#2C3E50" font-size="15" font-weight="700" text-anchor="middle">Teacher / Admin</text>
    <text x="53" y="148" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">(Exam Creator)</text>
  </g>

  <!-- Flow: Teacher <-> Monitor (Exam Authoring & Audio Upload) -->
  <line x1="175" y1="80" x2="330" y2="80" stroke="#2C3E50" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="252" y="62" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">PDF &amp; Audio Upload</text>
  <text x="252" y="76" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">(Authoring Definition)</text>

  <!-- ==================== 2. TOP MONITOR & AUTHORING TOOL ==================== -->
  <g id="top-monitor" transform="translate(335, 42)">
    <!-- Stand Neck -->
    <rect x="62" y="98" width="16" height="20" fill="#2C3E50"/>
    <!-- Stand Base -->
    <path d="M 45 120 L 95 120 Q 95 116 85 116 L 55 116 Q 45 116 45 120 Z" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <!-- Bezel -->
    <rect x="0" y="0" width="140" height="98" rx="8" fill="#2C3E50"/>
    <!-- Screen -->
    <rect x="6" y="6" width="128" height="86" rx="4" fill="#FFB946"/>
    <!-- Small UI Mockup on screen -->
    <rect x="18" y="18" width="104" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
    <line x1="24" y1="25" x2="60" y2="25" stroke="#2C3E50" stroke-width="2"/>
    <rect x="18" y="38" width="48" height="42" rx="2" fill="#2C3E50" fill-opacity="0.15"/>
    <rect x="72" y="38" width="50" height="42" rx="2" fill="#2C3E50" fill-opacity="0.15"/>
  </g>

  <!-- Authoring Tool Box (EduSphere Test Ingestion Studio) -->
  <g id="authoring-tool" transform="translate(265, 175)">
    <rect x="0" y="0" width="280" height="54" rx="3" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="140" y="25" fill="#2C3E50" font-size="14.5" font-weight="700" text-anchor="middle">Authoring &amp; Ingestion Tool</text>
    <text x="140" y="42" fill="#2C3E50" font-size="11.5" font-weight="600" text-anchor="middle">(Exam Ingestion Studio)</text>
  </g>

  <!-- AI Subsystem Pill (Gemini 3.6 Flash Multi-Agent) -->
  <g id="ai-ingestion-badge" transform="translate(585, 175)">
    <rect x="0" y="0" width="230" height="54" rx="3" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="115" y="24" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Gemini 3.6 Flash</text>
    <text x="115" y="42" fill="#2C3E50" font-size="11" font-weight="600" text-anchor="middle">Multi-Agent Ingestion Pipeline</text>
  </g>

  <!-- Arrow: Authoring Tool -> Multi-Agent AI -->
  <line x1="545" y1="202" x2="585" y2="202" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Authoring Tool <-> Items Bank -->
  <line x1="405" y1="230" x2="405" y2="305" stroke="#2C3E50" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

  <!-- Flow: Authoring Tool -> Score (Teacher's Solution Execution) -->
  <path d="M 815 202 L 845 202 L 845 305" fill="none" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="172" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Teacher’s Solution</text>
  <text x="915" y="190" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Execution</text>
  <text x="915" y="206" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">(Answer Keys &amp; Rubrics)</text>

  <!-- ==================== 3. ITEMS BANK (3 STACKED CYLINDERS) ==================== -->
  <g id="items-bank" transform="translate(300, 320)">
    <!-- Cylinder 1 (Back Left: SQL Server 2022) -->
    <g transform="translate(0, 0)">
      <path d="M 0 18 L 0 74 A 50 18 0 0 0 100 74 L 100 18 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
      <ellipse cx="50" cy="18" rx="50" ry="18" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    </g>
    <!-- Cylinder 2 (Back Right: AWS S3 Audio CDN) -->
    <g transform="translate(26, 22)">
      <path d="M 0 18 L 0 74 A 50 18 0 0 0 100 74 L 100 18 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
      <ellipse cx="50" cy="18" rx="50" ry="18" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    </g>
    <!-- Cylinder 3 (Front: Items Bank) -->
    <g transform="translate(52, 44)">
      <path d="M 0 18 L 0 82 A 50 18 0 0 0 100 82 L 100 18 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
      <ellipse cx="50" cy="18" rx="50" ry="18" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
      <text x="50" y="48" fill="#2C3E50" font-size="14" font-weight="700" text-anchor="middle">Items Bank</text>
      <text x="50" y="66" fill="#2C3E50" font-size="10.5" font-weight="600" text-anchor="middle">SQL &amp; S3 CDN</text>
      <text x="50" y="80" fill="#2C3E50" font-size="9.5" font-weight="500" text-anchor="middle">(Passages &amp; Audio)</text>
    </g>
  </g>

  <!-- Flow: Items Bank -> Score -->
  <line x1="455" y1="365" x2="590" y2="365" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== 4. SCORE LAYERED CARDS ==================== -->
  <g id="score-block" transform="translate(595, 310)">
    <!-- Layer 3 (Back cyan) -->
    <rect x="0" y="0" width="245" height="58" rx="2" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <!-- Layer 2 (Middle teal/cyan) -->
    <rect x="10" y="8" width="245" height="58" rx="2" fill="#5CE1E6" stroke="#2C3E50" stroke-width="2"/>
    <!-- Layer 1 (Front orange) -->
    <rect x="20" y="16" width="245" height="58" rx="2" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="142" y="43" fill="#2C3E50" font-size="15" font-weight="700" text-anchor="middle">Score Engine</text>
    <text x="142" y="60" fill="#2C3E50" font-size="11" font-weight="600" text-anchor="middle">(Cambridge Band 0–9 &amp; AI)</text>
  </g>

  <!-- Flow: Score -> Correction Database -->
  <line x1="860" y1="360" x2="910" y2="360" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== 5. CORRECTION DATABASE (STACKED DISKS) ==================== -->
  <g id="correction-database" transform="translate(908, 278)">
    <!-- Disk 1 -->
    <g transform="translate(0, 0)">
      <path d="M 0 15 L 0 78 A 36 15 0 0 0 72 78 L 72 15 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
      <ellipse cx="36" cy="15" rx="36" ry="15" fill="#FFB946" stroke="#2C3E50" stroke-width="1.8"/>
    </g>
    <!-- Disk 2 -->
    <g transform="translate(9, 3)">
      <path d="M 0 15 L 0 78 A 36 15 0 0 0 72 78 L 72 15 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
      <ellipse cx="36" cy="15" rx="36" ry="15" fill="#FFB946" stroke="#2C3E50" stroke-width="1.8"/>
    </g>
    <!-- Disk 3 -->
    <g transform="translate(18, 6)">
      <path d="M 0 15 L 0 78 A 36 15 0 0 0 72 78 L 72 15 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
      <ellipse cx="36" cy="15" rx="36" ry="15" fill="#FFB946" stroke="#2C3E50" stroke-width="1.8"/>
    </g>
    <!-- Disk 4 -->
    <g transform="translate(27, 9)">
      <path d="M 0 15 L 0 78 A 36 15 0 0 0 72 78 L 72 15 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
      <ellipse cx="36" cy="15" rx="36" ry="15" fill="#FFB946" stroke="#2C3E50" stroke-width="1.8"/>
    </g>
    <!-- Disk 5 -->
    <g transform="translate(36, 12)">
      <path d="M 0 15 L 0 78 A 36 15 0 0 0 72 78 L 72 15 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
      <ellipse cx="36" cy="15" rx="36" ry="15" fill="#FFB946" stroke="#2C3E50" stroke-width="1.8"/>
    </g>
    <!-- Disk 6 (Front) -->
    <g transform="translate(45, 15)">
      <path d="M 0 15 L 0 84 A 36 15 0 0 0 72 84 L 72 15 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
      <ellipse cx="36" cy="15" rx="36" ry="15" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
      <text x="36" y="50" fill="#2C3E50" font-size="12" font-weight="700" text-anchor="middle">Correction</text>
      <text x="36" y="66" fill="#2C3E50" font-size="12" font-weight="700" text-anchor="middle">Database</text>
      <text x="36" y="80" fill="#2C3E50" font-size="9" font-weight="600" text-anchor="middle">(Submissions)</text>
    </g>
  </g>

  <!-- ==================== 6. LEFT DOWNWARD FLOW & VERTICAL ARROW ==================== -->
  <!-- Long Left Arrow: Teacher -> Student Monitor (Remote Test Definition) -->
  <path d="M 125 100 L 125 635 L 325 635" fill="none" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="65" y="435" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Remote</text>
  <text x="65" y="453" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Test</text>
  <text x="65" y="471" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Definition</text>
  <text x="65" y="489" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">(Assigned Exams)</text>

  <!-- Flow: Items Bank -> Student Monitor -->
  <line x1="410" y1="470" x2="410" y2="585" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="515" width="130" height="28" rx="3" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="485" y="533" fill="#2C3E50" font-size="11" font-weight="700" text-anchor="middle">Live Audio Stream</text>

  <!-- ==================== 7. STUDENT PERSONA (BOTTOM-LEFT) ==================== -->
  <g id="student-avatar" transform="translate(20, 620)">
    <!-- Head -->
    <circle cx="53" cy="46" r="23" fill="#FCE8C5" stroke="#2C3E50" stroke-width="2"/>
    <!-- Hair -->
    <path d="M 33 40 Q 53 18 73 40 Q 55 42 33 40 Z" fill="#F5A623" stroke="#2C3E50" stroke-width="2"/>
    <!-- Headphones for CD-IELTS Listening -->
    <path d="M 30 46 A 23 23 0 0 1 76 46" fill="none" stroke="#2C3E50" stroke-width="3.5"/>
    <rect x="26" y="42" width="7" height="14" rx="3" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
    <rect x="73" y="42" width="7" height="14" rx="3" fill="#48CAE4" stroke="#2C3E50" stroke-width="1.8"/>
    <!-- Body / Teal Shirt -->
    <path d="M 30 90 L 38 68 Q 53 65 68 68 L 76 90 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <!-- Open Orange Book / Tablet in Front -->
    <rect x="36" y="82" width="17" height="26" rx="2" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <rect x="53" y="82" width="17" height="26" rx="2" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <line x1="53" y1="82" x2="53" y2="108" stroke="#2C3E50" stroke-width="2"/>
    <!-- Hands holding book -->
    <circle cx="28" cy="96" r="8.5" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <circle cx="78" cy="96" r="8.5" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <!-- Text Labels -->
    <text x="53" y="132" fill="#2C3E50" font-size="15" font-weight="700" text-anchor="middle">Student</text>
    <text x="53" y="148" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">(IELTS Candidate)</text>
  </g>

  <!-- Flow: Student <-> Monitor (Exercise Response) -->
  <line x1="160" y1="695" x2="330" y2="695" stroke="#2C3E50" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="245" y="678" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Exercise Response</text>
  <text x="245" y="692" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">(Live Test Answers)</text>

  <!-- ==================== 8. BOTTOM MONITOR & EDUSPHERE PLATFORM ==================== -->
  <g id="bottom-monitor" transform="translate(335, 595)">
    <!-- Stand Neck -->
    <rect x="62" y="98" width="16" height="20" fill="#2C3E50"/>
    <!-- Stand Base -->
    <path d="M 45 120 L 95 120 Q 95 116 85 116 L 55 116 Q 45 116 45 120 Z" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <!-- Bezel -->
    <rect x="0" y="0" width="140" height="98" rx="8" fill="#2C3E50"/>
    <!-- Screen -->
    <rect x="6" y="6" width="128" height="86" rx="4" fill="#FFB946"/>
    <!-- Screen split view mockup (CD-IELTS Workspace) -->
    <rect x="14" y="14" width="52" height="70" rx="2" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="74" y="14" width="52" height="70" rx="2" fill="#2C3E50" fill-opacity="0.15"/>
    <line x1="20" y1="24" x2="56" y2="24" stroke="#2C3E50" stroke-width="1.8"/>
    <line x1="20" y1="34" x2="48" y2="34" stroke="#2C3E50" stroke-width="1.8"/>
  </g>

  <!-- EduSphere Core Engine Box (Moodle Equivalent in EduSphere) -->
  <g id="edusphere-core-box" transform="translate(270, 735)">
    <rect x="0" y="0" width="270" height="54" rx="3" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="135" y="25" fill="#2C3E50" font-size="14.5" font-weight="700" text-anchor="middle">EduSphere API Gateway</text>
    <text x="135" y="42" fill="#2C3E50" font-size="11.5" font-weight="600" text-anchor="middle">(ASP.NET Core 8 &amp; MediatR CQRS)</text>
  </g>

  <!-- Flow: EduSphere Core <-> Redis Cache -->
  <line x1="540" y1="762" x2="655" y2="762" stroke="#2C3E50" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

  <!-- Bottom Score / Redis Cylinder -->
  <g id="bottom-score-cylinder" transform="translate(660, 712)">
    <path d="M 0 18 L 0 74 A 46 18 0 0 0 92 74 L 92 18 Z" fill="#48CAE4" stroke="#2C3E50" stroke-width="2"/>
    <ellipse cx="46" cy="18" rx="46" ry="18" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="46" y="50" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Redis 7.x</text>
    <text x="46" y="66" fill="#2C3E50" font-size="10.5" font-weight="600" text-anchor="middle">Cache &amp; OTP</text>
  </g>

  <!-- Flow: EduSphere Core -> Score Block (Student's Response Execution) -->
  <path d="M 540 740 L 715 530 L 715 390" fill="none" stroke="#2C3E50" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="825" y="520" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Student’s Response</text>
  <text x="825" y="538" fill="#2C3E50" font-size="13" font-weight="700" text-anchor="middle">Execution</text>
  <text x="825" y="554" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">(Submit Exam &amp; Answers)</text>

  <!-- ==================== 9. BOTTOM SPECIALIZED MODULES ==================== -->
  <!-- Remote Test Module (CD-IELTS Reading & Listening CBT Engine) -->
  <g id="remote-test-module" transform="translate(100, 875)">
    <rect x="0" y="0" width="250" height="54" rx="3" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="125" y="24" fill="#2C3E50" font-size="13.5" font-weight="700" text-anchor="middle">Remote Test Module</text>
    <text x="125" y="42" fill="#2C3E50" font-size="11" font-weight="600" text-anchor="middle">(CD-IELTS Reading &amp; Listening)</text>
  </g>

  <!-- Flow: Remote Test Module -> Team Creator / AI Explainer Module -->
  <line x1="350" y1="902" x2="480" y2="902" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Team Creator Module (AI Diagnostic Explainer & Socratic Tutor) -->
  <g id="team-creator-module" transform="translate(485, 875)">
    <rect x="0" y="0" width="255" height="54" rx="3" fill="#FFB946" stroke="#2C3E50" stroke-width="2"/>
    <text x="127" y="24" fill="#2C3E50" font-size="13.5" font-weight="700" text-anchor="middle">AI Diagnostic &amp; Tutor Module</text>
    <text x="127" y="42" fill="#2C3E50" font-size="11" font-weight="600" text-anchor="middle">(Phonetics, Traps &amp; Socratic Hints)</text>
  </g>

  <!-- Dashed flows up to EduSphere API Gateway -->
  <path d="M 235 873 L 355 791" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 595 873 L 450 791" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ==================== 10. EDUSPHERE BRAND WATERMARK (BOTTOM-LEFT) ==================== -->
  <g id="brand-logo" transform="translate(25, 975)">
    <!-- EduSphere Colorful Diamond Grid (matching the vector style) -->
    <g transform="translate(0, 2)">
      <polygon points="6,0 12,6 6,12 0,6" fill="#EF4444"/>
      <polygon points="14,0 20,6 14,12 8,6" fill="#F5A623"/>
      <polygon points="10,6 16,12 10,18 4,12" fill="#5CE1E6"/>
      <polygon points="18,6 24,12 18,18 12,12" fill="#00B4D8"/>
      <polygon points="6,12 12,18 6,24 0,18" fill="#F5A623"/>
      <polygon points="14,12 20,18 14,24 8,18" fill="#EF4444"/>
      <polygon points="22,12 28,18 22,24 16,18" fill="#00B4D8"/>
    </g>
    <!-- Brand Typography -->
    <text x="36" y="19" fill="#2C3E50" font-size="22" font-weight="800" letter-spacing="-0.3">EduSphere</text>
    <text x="160" y="19" fill="#64748B" font-size="12.5" font-weight="600">IELTS System Architecture</text>
  </g>
</svg>
